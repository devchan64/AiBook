<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" role="img" aria-labelledby="title desc">
  <title id="title">원시 곡선을 구간 토큰으로 바꾸는 과정</title>
  <desc id="desc">원시 시계열 곡선을 다섯 구간으로 나누고 각 구간의 방향과 강도를 UP2, UP1, FLAT, DOWN1, DOWN2 토큰으로 요약하는 차트</desc>
  <rect width="760" height="430" fill="#ffffff"/>
  <text x="40" y="34" font-family="sans-serif" font-size="20" font-weight="700" fill="#1f2328">연속 곡선을 짧은 토큰 시퀀스로 압축한다</text>
  <text x="40" y="60" font-family="sans-serif" font-size="14" fill="#57606a">구간별 기울기를 보면 원시 모양을 모두 보지 않아도 방향과 강도를 빠르게 비교할 수 있다.</text>

  <line x1="70" y1="300" x2="690" y2="300" stroke="#24292f" stroke-width="2"/>
  <line x1="70" y1="300" x2="70" y2="90" stroke="#24292f" stroke-width="2"/>
  <polygon points="690,300 680,295 680,305" fill="#24292f"/>
  <polygon points="70,90 65,100 75,100" fill="#24292f"/>
  <text x="696" y="305" font-family="sans-serif" font-size="13" fill="#24292f">시간</text>
  <text x="39" y="86" font-family="sans-serif" font-size="13" fill="#24292f">값</text>

  <g stroke="#d0d7de" stroke-width="1">
    <line x1="70" y1="250" x2="690" y2="250"/>
    <line x1="70" y1="200" x2="690" y2="200"/>
    <line x1="70" y1="150" x2="690" y2="150"/>
    <line x1="194" y1="90" x2="194" y2="300"/>
    <line x1="318" y1="90" x2="318" y2="300"/>
    <line x1="442" y1="90" x2="442" y2="300"/>
    <line x1="566" y1="90" x2="566" y2="300"/>
  </g>
  <g stroke="#8c959f" stroke-dasharray="6 5" stroke-width="1.5">
    <line x1="194" y1="90" x2="194" y2="345"/>
    <line x1="318" y1="90" x2="318" y2="345"/>
    <line x1="442" y1="90" x2="442" y2="345"/>
    <line x1="566" y1="90" x2="566" y2="345"/>
  </g>

  <polyline points="70,270 194,185 318,158 442,163 566,220 690,300" fill="none" stroke="#0969da" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#0969da">
    <circle cx="70" cy="270" r="5"/>
    <circle cx="194" cy="185" r="5"/>
    <circle cx="318" cy="158" r="5"/>
    <circle cx="442" cy="163" r="5"/>
    <circle cx="566" cy="220" r="5"/>
    <circle cx="690" cy="300" r="5"/>
  </g>

  <g font-family="sans-serif" font-size="13" fill="#57606a">
    <text x="112" y="132">큰 상승</text>
    <text x="238" y="135">완만한 상승</text>
    <text x="348" y="146">거의 평평</text>
    <text x="473" y="196">하강</text>
    <text x="595" y="270">큰 하강</text>
  </g>

  <g font-family="sans-serif" font-size="14" font-weight="700" text-anchor="middle">
    <rect x="82" y="334" width="100" height="42" rx="6" fill="#ddf4ff" stroke="#0969da"/>
    <text x="132" y="360" fill="#0969da">UP2</text>
    <rect x="206" y="334" width="100" height="42" rx="6" fill="#ddf4ff" stroke="#0969da"/>
    <text x="256" y="360" fill="#0969da">UP1</text>
    <rect x="330" y="334" width="100" height="42" rx="6" fill="#f6f8fa" stroke="#8c959f"/>
    <text x="380" y="360" fill="#57606a">FLAT</text>
    <rect x="454" y="334" width="100" height="42" rx="6" fill="#ffebe9" stroke="#cf222e"/>
    <text x="504" y="360" fill="#cf222e">DOWN1</text>
    <rect x="578" y="334" width="100" height="42" rx="6" fill="#ffebe9" stroke="#cf222e"/>
    <text x="628" y="360" fill="#cf222e">DOWN2</text>
  </g>

  <text x="70" y="406" font-family="sans-serif" font-size="14" fill="#24292f">요약: 세부 곡선을 모두 보존하지는 않지만, 구간 순서와 방향은 더 빠르게 읽힌다.</text>
</svg>
