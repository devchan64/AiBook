<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" role="img" aria-labelledby="title desc">
  <title id="title">회귀선 위 잔차 간격</title>
  <desc id="desc">회귀선이 있는 산점도에서 실제 점과 직선 위 예측값 사이의 세로 간격을 통해 양의 잔차와 음의 잔차를 보여 줍니다.</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
      .title { font: 700 22px sans-serif; fill: #0f172a; }
      .subtitle { font: 400 14px sans-serif; fill: #475569; }
      .axis { stroke: #64748b; stroke-width: 1.6; }
      .grid { stroke: #e2e8f0; stroke-width: 1; }
      .tick { font: 12px sans-serif; fill: #475569; }
      .label { font: 700 13px sans-serif; fill: #334155; }
      .point { fill: #2563eb; }
      .line { stroke: #0f766e; stroke-width: 3.5; fill: none; }
      .res-pos { stroke: #dc2626; stroke-width: 2.6; }
      .res-neg { stroke: #f59e0b; stroke-width: 2.6; }
      .note { font: 400 13px sans-serif; fill: #334155; }
      .card { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.2; }
      .card-body { font: 400 13px sans-serif; fill: #334155; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="760" height="430" rx="22" />
  <text class="title" x="38" y="42">잔차는 실제값과 예측값 사이의 세로 간격입니다</text>
  <text class="subtitle" x="38" y="66">양의 잔차는 모델이 낮게 예측한 경우, 음의 잔차는 높게 예측한 경우입니다.</text>

  <rect class="panel" x="34" y="94" width="470" height="286" rx="16" />

  <line class="grid" x1="92" y1="126" x2="454" y2="126" />
  <line class="grid" x1="92" y1="176" x2="454" y2="176" />
  <line class="grid" x1="92" y1="226" x2="454" y2="226" />
  <line class="grid" x1="92" y1="276" x2="454" y2="276" />
  <line class="grid" x1="92" y1="326" x2="454" y2="326" />
  <line class="grid" x1="92" y1="126" x2="92" y2="326" />
  <line class="grid" x1="152" y1="126" x2="152" y2="326" />
  <line class="grid" x1="212" y1="126" x2="212" y2="326" />
  <line class="grid" x1="272" y1="126" x2="272" y2="326" />
  <line class="grid" x1="332" y1="126" x2="332" y2="326" />
  <line class="grid" x1="392" y1="126" x2="392" y2="326" />
  <line class="grid" x1="454" y1="126" x2="454" y2="326" />

  <line class="axis" x1="92" y1="326" x2="454" y2="326" />
  <line class="axis" x1="92" y1="326" x2="92" y2="126" />
  <path class="line" d="M92 300 L454 154" />

  <line class="res-pos" x1="154" y1="275" x2="154" y2="250" />
  <line class="res-neg" x1="214" y1="250" x2="214" y2="272" />
  <line class="res-pos" x1="332" y1="203" x2="332" y2="176" />

  <circle class="point" cx="120" cy="288" r="6" />
  <circle class="point" cx="154" cy="250" r="6" />
  <circle class="point" cx="214" cy="272" r="6" />
  <circle class="point" cx="272" cy="222" r="6" />
  <circle class="point" cx="332" cy="176" r="6" />
  <circle class="point" cx="392" cy="170" r="6" />

  <text class="tick" x="88" y="344">0</text>
  <text class="tick" x="148" y="344">1</text>
  <text class="tick" x="208" y="344">2</text>
  <text class="tick" x="268" y="344">3</text>
  <text class="tick" x="328" y="344">4</text>
  <text class="tick" x="388" y="344">5</text>
  <text class="tick" x="448" y="344">6</text>

  <text class="tick" x="62" y="330">52</text>
  <text class="tick" x="62" y="280">58</text>
  <text class="tick" x="62" y="230">64</text>
  <text class="tick" x="62" y="180">70</text>
  <text class="tick" x="62" y="130">76</text>

  <text class="label" x="402" y="364">공부 시간</text>
  <text class="label" x="44" y="118">점수</text>
  <text class="note" x="168" y="246">음의 잔차</text>
  <text class="note" x="342" y="172">양의 잔차</text>

  <rect class="card" x="530" y="122" width="194" height="78" rx="12" />
  <text class="label" x="548" y="148">양의 잔차</text>
  <text class="card-body" x="548" y="172">actual - predicted &gt; 0</text>
  <text class="card-body" x="548" y="192">모델이 너무 낮게 예측했습니다.</text>

  <rect class="card" x="530" y="214" width="194" height="78" rx="12" />
  <text class="label" x="548" y="240">음의 잔차</text>
  <text class="card-body" x="548" y="264">actual - predicted &lt; 0</text>
  <text class="card-body" x="548" y="284">모델이 너무 높게 예측했습니다.</text>

  <rect class="card" x="530" y="306" width="194" height="58" rx="12" />
  <text class="card-body" x="548" y="332">잔차 크기는 얼마나 빗나갔는지 보여 줍니다.</text>
  <text class="card-body" x="548" y="352">잔차 부호는 어느 쪽으로 빗나갔는지 보여 줍니다.</text>
</svg>
