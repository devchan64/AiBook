<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" role="img" aria-labelledby="title desc">
  <title id="title">Service composition map with rules, search, ML, and LLM</title>
  <desc id="desc">A user request enters an application, which fans out to rule checks, search or database, an ML model, and an LLM. These feed a policy decision, which either responds directly or sends low-confidence and high-risk cases to human review before responding.</desc>
  <defs><style>
      .bg{fill:#f6f4ef}.box{fill:#fffdfa;stroke:#3f3a34;stroke-width:2;rx:18;ry:18}.accent{fill:#e7efe3;stroke:#2f6b3b;stroke-width:2;rx:18;ry:18}.text{fill:#1f1b16;font-family:"Helvetica Neue",Arial,sans-serif;font-size:21px;text-anchor:middle}.small{font-size:18px}.arrow{fill:none;stroke:#5b5349;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.dash{fill:none;stroke:#5b5349;stroke-width:3;stroke-dasharray:8 7;stroke-linecap:round}
    </style><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#5b5349"/></marker></defs>
  <rect class="bg" width="920" height="420"/>
  <rect class="accent" x="52" y="168" width="170" height="64"/><text class="text" x="137" y="206">user request</text>
  <rect class="box" x="286" y="168" width="170" height="64"/><text class="text" x="371" y="206">application</text>
  <rect class="box" x="520" y="38" width="170" height="64"/><text class="text" x="605" y="76">rule checks</text>
  <rect class="box" x="520" y="124" width="170" height="64"/><text class="text" x="605" y="162">search / database</text>
  <rect class="box" x="520" y="210" width="170" height="64"/><text class="text" x="605" y="248">ML model</text>
  <rect class="box" x="520" y="296" width="170" height="64"/><text class="text" x="605" y="334">LLM</text>
  <rect class="accent" x="744" y="168" width="140" height="64"/><text class="text" x="814" y="206">policy decision</text>
  <rect class="box" x="744" y="300" width="140" height="64"/><text class="text small" x="814" y="330">human review</text><text class="text small" x="814" y="352">when needed</text>
  <rect class="box" x="744" y="54" width="140" height="64"/><text class="text" x="814" y="92">service response</text>
  <path class="arrow" marker-end="url(#ah)" d="M222 200 L286 200"/>
  <path class="arrow" marker-end="url(#ah)" d="M456 200 L520 70"/>
  <path class="arrow" marker-end="url(#ah)" d="M456 200 L520 156"/>
  <path class="arrow" marker-end="url(#ah)" d="M456 200 L520 242"/>
  <path class="arrow" marker-end="url(#ah)" d="M456 200 L520 328"/>
  <path class="arrow" marker-end="url(#ah)" d="M690 70 L744 200"/>
  <path class="arrow" marker-end="url(#ah)" d="M690 156 L744 200"/>
  <path class="arrow" marker-end="url(#ah)" d="M690 242 L744 200"/>
  <path class="arrow" marker-end="url(#ah)" d="M690 328 L744 200"/>
  <path class="arrow" marker-end="url(#ah)" d="M814 168 L814 118"/>
  <path class="dash" marker-end="url(#ah)" d="M814 232 L814 300"/>
</svg>
