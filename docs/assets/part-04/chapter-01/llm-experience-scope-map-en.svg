<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 280" role="img" aria-labelledby="title desc">
  <title id="title">LLM experience versus broader AI scope</title>
  <desc id="desc">One path goes from chatbot or image tool experience to jumping to AI equals LLM and then to hidden service structure. Another path goes from the same experience to separating search, rules, models, policy, and human review, then to LLM becoming one component, and finally to a wider AI scope again.</desc>
  <defs><style>
      .bg{fill:#f6f4ef}.box{fill:#fffdfa;stroke:#3f3a34;stroke-width:2;rx:18;ry:18}.accent{fill:#e7efe3;stroke:#2f6b3b;stroke-width:2;rx:18;ry:18}.text{fill:#1f1b16;font-family:"Helvetica Neue",Arial,sans-serif;font-size:20px;text-anchor:middle}.small{font-size:17px}.arrow{fill:none;stroke:#5b5349;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
    </style><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#5b5349"/></marker></defs>
  <rect class="bg" width="920" height="280"/>
  <rect class="accent" x="28" y="108" width="210" height="64"/><text class="text small" x="133" y="136">chatbot or image-tool</text><text class="text small" x="133" y="158">experience</text>
  <rect class="box" x="296" y="38" width="170" height="64"/><text class="text" x="381" y="76">jump to AI = LLM</text>
  <rect class="box" x="524" y="38" width="170" height="64"/><text class="text small" x="609" y="66">service structure</text><text class="text small" x="609" y="88">stays hidden</text>
  <rect class="box" x="296" y="178" width="200" height="64"/><text class="text small" x="396" y="206">separate search, rules,</text><text class="text small" x="396" y="228">models, policy, review</text>
  <rect class="box" x="554" y="178" width="150" height="64"/><text class="text small" x="629" y="206">LLM becomes</text><text class="text small" x="629" y="228">one component</text>
  <rect class="accent" x="762" y="178" width="130" height="64"/><text class="text small" x="827" y="206">AI scope gets</text><text class="text small" x="827" y="228">wider again</text>
  <path class="arrow" marker-end="url(#ah)" d="M238 120 L296 82"/>
  <path class="arrow" marker-end="url(#ah)" d="M466 70 L524 70"/>
  <path class="arrow" marker-end="url(#ah)" d="M238 160 L296 210"/>
  <path class="arrow" marker-end="url(#ah)" d="M496 210 L554 210"/>
  <path class="arrow" marker-end="url(#ah)" d="M704 210 L762 210"/>
</svg>
