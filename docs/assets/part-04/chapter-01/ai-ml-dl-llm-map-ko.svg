<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 360" role="img" aria-labelledby="title desc">
  <title id="title">AI, 머신러닝, 딥러닝, 생성형 AI, LLM 관계 지도</title>
  <desc id="desc">위에서 아래로 내려가는 흐름도다. 맨 위의 AI에서 머신러닝과 규칙 기반 시스템으로 갈라지고, 머신러닝은 다시 딥러닝, 생성형 AI, LLM으로 이어진다.</desc>
  <defs>
    <style>
      .bg { fill: #f6f4ef; }
      .box { fill: #fffdfa; stroke: #3f3a34; stroke-width: 2; rx: 18; ry: 18; }
      .accent { fill: #e7efe3; stroke: #2f6b3b; stroke-width: 2; rx: 18; ry: 18; }
      .text { fill: #1f1b16; font-family: "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif; font-size: 22px; text-anchor: middle; }
      .small { font-size: 19px; }
      .arrow { fill: none; stroke: #5b5349; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    </style>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#5b5349"/>
    </marker>
  </defs>
  <rect class="bg" width="920" height="360"/>
  <rect class="accent" x="325" y="26" width="270" height="64"/>
  <text class="text" x="460" y="56">AI</text>
  <text class="text small" x="460" y="80">artificial intelligence</text>
  <rect class="box" x="150" y="122" width="280" height="70"/>
  <text class="text" x="290" y="150">머신러닝</text>
  <text class="text small" x="290" y="176">data-driven learning</text>
  <rect class="box" x="500" y="122" width="280" height="70"/>
  <text class="text" x="640" y="150">규칙 기반 시스템</text>
  <text class="text small" x="640" y="176">search, heuristic, knowledge</text>
  <rect class="box" x="150" y="224" width="240" height="70"/>
  <text class="text" x="270" y="252">딥러닝</text>
  <text class="text small" x="270" y="278">neural-network learning</text>
  <rect class="box" x="430" y="224" width="240" height="70"/>
  <text class="text" x="550" y="252">생성형 AI</text>
  <text class="text small" x="550" y="278">text, image, audio, code</text>
  <rect class="box" x="700" y="224" width="170" height="70"/>
  <text class="text" x="785" y="252">LLM</text>
  <text class="text small" x="785" y="278">large language model</text>
  <path class="arrow" marker-end="url(#ah)" d="M420 90 L324 122"/>
  <path class="arrow" marker-end="url(#ah)" d="M500 90 L606 122"/>
  <path class="arrow" marker-end="url(#ah)" d="M290 192 L270 224"/>
  <path class="arrow" marker-end="url(#ah)" d="M390 259 L430 259"/>
  <path class="arrow" marker-end="url(#ah)" d="M670 259 L700 259"/>
</svg>
