<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 310" role="img" aria-labelledby="title desc">
  <title id="title">고객 문의 분류에서 규칙 경로와 학습 경로를 비교하는 도식</title>
  <desc id="desc">한 경로는 고객 문의에서 사람이 쓴 키워드 규칙을 맞추고, 표현 변화나 섞인 의도가 나타나면서 규칙 경로가 약해지는 흐름으로 간다. 다른 경로는 라벨이 붙은 과거 문의를 모으고, 입력과 라벨의 관계를 학습하고, 보지 못한 문의로 시험해 일반화가 충분한지 판단하는 흐름으로 간다.</desc>
  <defs><style>
      .bg{fill:#f6f4ef}.box{fill:#fffdfa;stroke:#3f3a34;stroke-width:2;rx:18;ry:18}.accent{fill:#e7efe3;stroke:#2f6b3b;stroke-width:2;rx:18;ry:18}.text{fill:#1f1b16;font-family:"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;font-size:19px;text-anchor:middle}.small{font-size:16px}.arrow{fill:none;stroke:#5b5349;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
    </style><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#5b5349"/></marker></defs>
  <rect class="bg" width="920" height="310"/>
  <rect class="accent" x="28" y="123" width="150" height="60"/><text class="text small" x="103" y="157">고객 문의</text>
  <rect class="box" x="214" y="42" width="180" height="60"/><text class="text small" x="304" y="68">사람이 쓴 키워드</text><text class="text small" x="304" y="90">규칙을 맞춘다</text>
  <rect class="box" x="430" y="42" width="180" height="60"/><text class="text small" x="520" y="68">표현이 바뀌거나</text><text class="text small" x="520" y="90">의도가 섞여 들어온다</text>
  <rect class="box" x="646" y="42" width="170" height="60"/><text class="text small" x="731" y="76">규칙 경로가</text><text class="text small" x="731" y="96">약해진다</text>
  <rect class="box" x="214" y="204" width="180" height="60"/><text class="text small" x="304" y="230">라벨이 붙은</text><text class="text small" x="304" y="252">과거 문의를 모은다</text>
  <rect class="box" x="430" y="204" width="180" height="60"/><text class="text small" x="520" y="230">입력과 라벨의</text><text class="text small" x="520" y="252">관계를 학습한다</text>
  <rect class="box" x="646" y="204" width="130" height="60"/><text class="text small" x="711" y="238">보지 못한 문의로</text><text class="text small" x="711" y="258">시험한다</text>
  <rect class="accent" x="792" y="204" width="100" height="60"/><text class="text small" x="842" y="230">일반화가</text><text class="text small" x="842" y="252">충분한가?</text>
  <path class="arrow" marker-end="url(#ah)" d="M178 132 L214 80"/>
  <path class="arrow" marker-end="url(#ah)" d="M394 72 L430 72"/>
  <path class="arrow" marker-end="url(#ah)" d="M610 72 L646 72"/>
  <path class="arrow" marker-end="url(#ah)" d="M178 174 L214 234"/>
  <path class="arrow" marker-end="url(#ah)" d="M394 234 L430 234"/>
  <path class="arrow" marker-end="url(#ah)" d="M610 234 L646 234"/>
  <path class="arrow" marker-end="url(#ah)" d="M776 234 L792 234"/>
</svg>
