<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 310" role="img" aria-labelledby="title desc">
  <title id="title">Customer inquiry classification: rule path versus learning path</title>
  <desc id="desc">One path goes from customer inquiry to matching a hand-written keyword rule, then to phrasing changes or mixed intent, and finally to a brittle rule path. Another path goes from the same inquiry to collecting labeled past inquiries, learning the input-label relation, testing on unseen inquiries, and deciding whether generalization is good enough.</desc>
  <defs><style>
      .bg{fill:#f6f4ef}.box{fill:#fffdfa;stroke:#3f3a34;stroke-width:2;rx:18;ry:18}.accent{fill:#e7efe3;stroke:#2f6b3b;stroke-width:2;rx:18;ry:18}.text{fill:#1f1b16;font-family:"Helvetica Neue",Arial,sans-serif;font-size:19px;text-anchor:middle}.small{font-size:16px}.arrow{fill:none;stroke:#5b5349;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
    </style><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#5b5349"/></marker></defs>
  <rect class="bg" width="920" height="310"/>
  <rect class="accent" x="28" y="123" width="150" height="60"/><text class="text small" x="103" y="149">customer inquiry</text>
  <rect class="box" x="214" y="42" width="180" height="60"/><text class="text small" x="304" y="68">match a hand-written</text><text class="text small" x="304" y="90">keyword rule</text>
  <rect class="box" x="430" y="42" width="180" height="60"/><text class="text small" x="520" y="68">phrasing changes or</text><text class="text small" x="520" y="90">mixed intent appears</text>
  <rect class="box" x="646" y="42" width="170" height="60"/><text class="text small" x="731" y="76">rule path becomes</text><text class="text small" x="731" y="96">brittle</text>
  <rect class="box" x="214" y="204" width="180" height="60"/><text class="text small" x="304" y="230">collect labeled</text><text class="text small" x="304" y="252">past inquiries</text>
  <rect class="box" x="430" y="204" width="180" height="60"/><text class="text small" x="520" y="230">learn input-label</text><text class="text small" x="520" y="252">relation</text>
  <rect class="box" x="646" y="204" width="130" height="60"/><text class="text small" x="711" y="238">test on unseen</text><text class="text small" x="711" y="258">inquiries</text>
  <rect class="accent" x="792" y="204" width="100" height="60"/><text class="text small" x="842" y="230">is</text><text class="text small" x="842" y="252">generalization enough?</text>
  <path class="arrow" marker-end="url(#ah)" d="M178 132 L214 80"/>
  <path class="arrow" marker-end="url(#ah)" d="M394 72 L430 72"/>
  <path class="arrow" marker-end="url(#ah)" d="M610 72 L646 72"/>
  <path class="arrow" marker-end="url(#ah)" d="M178 174 L214 234"/>
  <path class="arrow" marker-end="url(#ah)" d="M394 234 L430 234"/>
  <path class="arrow" marker-end="url(#ah)" d="M610 234 L646 234"/>
  <path class="arrow" marker-end="url(#ah)" d="M776 234 L792 234"/>
</svg>
