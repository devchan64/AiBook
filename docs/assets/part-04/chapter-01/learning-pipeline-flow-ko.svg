<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 220" role="img" aria-labelledby="title desc">
  <title id="title">머신러닝 기본 학습 흐름</title>
  <desc id="desc">사례가 특징 X와 라벨 y로 정리되고, 학습을 거쳐 학습된 모델이 된다. 새 입력은 학습된 모델로 들어가 예측을 만든다.</desc>
  <defs><style>
      .bg{fill:#f6f4ef}.box{fill:#fffdfa;stroke:#3f3a34;stroke-width:2;rx:18;ry:18}.accent{fill:#e7efe3;stroke:#2f6b3b;stroke-width:2;rx:18;ry:18}.text{fill:#1f1b16;font-family:"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;font-size:20px;text-anchor:middle}.small{font-size:17px}.arrow{fill:none;stroke:#5b5349;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
    </style><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#5b5349"/></marker></defs>
  <rect class="bg" width="920" height="220"/>
  <rect class="accent" x="26" y="48" width="130" height="56"/><text class="text" x="91" y="83">사례</text>
  <rect class="box" x="196" y="48" width="160" height="56"/><text class="text small" x="276" y="83">특징 X + 라벨 y</text>
  <rect class="box" x="396" y="48" width="130" height="56"/><text class="text" x="461" y="83">학습</text>
  <rect class="box" x="566" y="48" width="150" height="56"/><text class="text small" x="641" y="83">학습된 모델</text>
  <rect class="accent" x="396" y="140" width="130" height="52"/><text class="text" x="461" y="173">새 입력</text>
  <rect class="box" x="756" y="94" width="138" height="56"/><text class="text" x="825" y="129">예측</text>
  <path class="arrow" marker-end="url(#ah)" d="M156 76 L196 76"/>
  <path class="arrow" marker-end="url(#ah)" d="M356 76 L396 76"/>
  <path class="arrow" marker-end="url(#ah)" d="M526 76 L566 76"/>
  <path class="arrow" marker-end="url(#ah)" d="M526 166 L620 104"/>
  <path class="arrow" marker-end="url(#ah)" d="M716 76 L756 112"/>
</svg>
