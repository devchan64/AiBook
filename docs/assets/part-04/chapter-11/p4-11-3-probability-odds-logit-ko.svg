<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 430" role="img" aria-labelledby="title desc">
  <title id="title">확률, odds, log-odds의 대응 눈금</title>
  <desc id="desc">확률, odds, log-odds를 나란히 놓고 probability 0.5, odds 1, log-odds 0이 같은 결정 중간점을 가리킨다는 점을 보여 줍니다.</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
      .title { font: 700 22px sans-serif; fill: #0f172a; }
      .subtitle { font: 400 14px sans-serif; fill: #475569; }
      .axis { stroke: #64748b; stroke-width: 1.6; }
      .tick { font: 12px sans-serif; fill: #475569; }
      .label { font: 700 14px sans-serif; fill: #334155; }
      .guide { stroke: #94a3b8; stroke-width: 1.4; stroke-dasharray: 4 4; }
      .mid { stroke: #dc2626; stroke-width: 2.5; stroke-dasharray: 6 5; }
      .dot { fill: #2563eb; }
      .mid-dot { fill: #dc2626; }
      .note { font: 400 13px sans-serif; fill: #334155; }
      .card { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.2; }
      .card-body { font: 400 13px sans-serif; fill: #334155; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="920" height="430" rx="22" />
  <text class="title" x="36" y="42">세 개의 눈금, 하나의 결정 중간점</text>
  <text class="subtitle" x="36" y="66">로지스틱 회귀는 같은 상태를 probability, odds, log-odds로 다르게 읽게 합니다.</text>

  <g transform="translate(28 98)">
    <rect class="panel" x="0" y="0" width="270" height="250" rx="16" />
    <text class="label" x="20" y="30">확률 p</text>
    <line class="axis" x1="86" y1="52" x2="86" y2="212" />
    <circle class="dot" cx="86" cy="184" r="6" />
    <circle class="mid-dot" cx="86" cy="132" r="7" />
    <circle class="dot" cx="86" cy="80" r="6" />
    <line class="mid" x1="40" y1="132" x2="230" y2="132" />
    <text class="tick" x="52" y="188">0.10</text>
    <text class="tick" x="56" y="136">0.50</text>
    <text class="tick" x="52" y="84">0.90</text>
    <text class="note" x="118" y="84">class 1 쪽이 강함</text>
    <text class="note" x="118" y="136">결정 중간점</text>
    <text class="note" x="118" y="188">class 0 쪽이 강함</text>
  </g>

  <g transform="translate(324 98)">
    <rect class="panel" x="0" y="0" width="270" height="250" rx="16" />
    <text class="label" x="20" y="30">Odds p / (1 - p)</text>
    <line class="axis" x1="86" y1="52" x2="86" y2="212" />
    <circle class="dot" cx="86" cy="184" r="6" />
    <circle class="mid-dot" cx="86" cy="132" r="7" />
    <circle class="dot" cx="86" cy="80" r="6" />
    <line class="mid" x1="40" y1="132" x2="230" y2="132" />
    <text class="tick" x="52" y="188">0.11</text>
    <text class="tick" x="64" y="136">1</text>
    <text class="tick" x="60" y="84">9</text>
    <text class="note" x="118" y="84">class 1 odds가 우세</text>
    <text class="note" x="118" y="136">odds가 같음</text>
    <text class="note" x="118" y="188">class 0 odds가 우세</text>
  </g>

  <g transform="translate(620 98)">
    <rect class="panel" x="0" y="0" width="270" height="250" rx="16" />
    <text class="label" x="20" y="30">Log-odds z</text>
    <line class="axis" x1="40" y1="132" x2="230" y2="132" />
    <circle class="dot" cx="76" cy="132" r="6" />
    <circle class="mid-dot" cx="136" cy="132" r="7" />
    <circle class="dot" cx="196" cy="132" r="6" />
    <line class="mid" x1="136" y1="52" x2="136" y2="212" />
    <text class="tick" x="64" y="154">-2.20</text>
    <text class="tick" x="132" y="154">0</text>
    <text class="tick" x="184" y="154">2.20</text>
    <text class="note" x="54" y="92">class 0 쪽</text>
    <text class="note" x="120" y="92">경계</text>
    <text class="note" x="176" y="92">class 1 쪽</text>
  </g>

  <line class="guide" x1="164" y1="230" x2="460" y2="230" />
  <line class="guide" x1="460" y1="230" x2="756" y2="230" />

  <rect class="card" x="110" y="374" width="700" height="22" rx="8" />
  <text class="card-body" x="126" y="389">p = 0.5, odds = 1, log-odds z = 0은 모두 클래스 판단이 바뀌는 같은 위치를 설명합니다.</text>
</svg>
