<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 430" role="img" aria-labelledby="title desc">
  <title id="title">같은 확률 축 위 threshold 이동</title>
  <desc id="desc">같은 확률 점수를 threshold 0.5와 0.7에서 어떻게 다르게 읽는지 비교합니다. threshold가 더 엄격해질수록 class 1 영역은 줄어듭니다.</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
      .title { font: 700 22px sans-serif; fill: #0f172a; }
      .subtitle { font: 400 14px sans-serif; fill: #475569; }
      .axis { stroke: #64748b; stroke-width: 1.6; }
      .tick { font: 12px sans-serif; fill: #475569; }
      .label { font: 700 13px sans-serif; fill: #334155; }
      .score { fill: #2563eb; }
      .score-shift { fill: #0f766e; }
      .threshold { stroke: #dc2626; stroke-width: 2.6; stroke-dasharray: 6 5; }
      .region0 { fill: #dbeafe; opacity: 0.45; }
      .region1 { fill: #fee2e2; opacity: 0.45; }
      .panel-title { font: 700 18px sans-serif; fill: #0f172a; }
      .note { font: 400 13px sans-serif; fill: #334155; }
      .card { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.2; }
      .card-body { font: 400 13px sans-serif; fill: #334155; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="920" height="430" rx="22" />
  <text class="title" x="36" y="42">점수는 같아도 정책선은 움직일 수 있습니다</text>
  <text class="subtitle" x="36" y="66">threshold를 바꾼다고 모델을 다시 학습하는 것은 아닙니다. class 1이 시작되는 위치만 바뀝니다.</text>

  <g transform="translate(30 96)">
    <rect class="panel" x="0" y="0" width="390" height="286" rx="16" />
    <text class="panel-title" x="20" y="30">Threshold = 0.5</text>
    <rect class="region0" x="52" y="92" width="143" height="110" rx="10" />
    <rect class="region1" x="195" y="92" width="145" height="110" rx="10" />
    <line class="axis" x1="52" y1="222" x2="340" y2="222" />
    <line class="threshold" x1="195" y1="82" x2="195" y2="232" />
    <circle class="score" cx="121" cy="222" r="7" />
    <circle class="score" cx="218" cy="222" r="7" />
    <circle class="score" cx="281" cy="222" r="7" />
    <text class="tick" x="108" y="244">0.42</text>
    <text class="tick" x="205" y="244">0.58</text>
    <text class="tick" x="268" y="244">0.73</text>
    <text class="note" x="72" y="118">class 0 영역</text>
    <text class="note" x="228" y="118">class 1 영역</text>
    <text class="note" x="170" y="78">정책선</text>
    <text class="note" x="70" y="272">0.58과 0.73은 모두 class 1로 읽힙니다.</text>
  </g>

  <g transform="translate(470 96)">
    <rect class="panel" x="0" y="0" width="390" height="286" rx="16" />
    <text class="panel-title" x="20" y="30">Threshold = 0.7</text>
    <rect class="region0" x="52" y="92" width="202" height="110" rx="10" />
    <rect class="region1" x="254" y="92" width="86" height="110" rx="10" />
    <line class="axis" x1="52" y1="222" x2="340" y2="222" />
    <line class="threshold" x1="254" y1="82" x2="254" y2="232" />
    <circle class="score-shift" cx="121" cy="222" r="7" />
    <circle class="score-shift" cx="218" cy="222" r="7" />
    <circle class="score-shift" cx="281" cy="222" r="7" />
    <text class="tick" x="108" y="244">0.42</text>
    <text class="tick" x="205" y="244">0.58</text>
    <text class="tick" x="268" y="244">0.73</text>
    <text class="note" x="72" y="118">class 0 영역</text>
    <text class="note" x="268" y="118">class 1 영역</text>
    <text class="note" x="230" y="78">더 엄격한 선</text>
    <text class="note" x="70" y="272">0.73만 class 1에 남습니다.</text>
  </g>

  <rect class="card" x="140" y="392" width="640" height="22" rx="8" />
  <text class="card-body" x="158" y="407">여기서 경계 이동은 같은 점수 축 위 정책 변화이지, 새 모델을 다시 맞춘 결과가 아닙니다.</text>
</svg>
