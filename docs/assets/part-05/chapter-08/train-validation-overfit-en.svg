<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 430" role="img" aria-labelledby="title desc">
  <title id="title">Training and validation curves during overfitting</title>
  <desc id="desc">A coordinate chart where training loss keeps decreasing while validation loss first decreases and then rises after the overfitting point, showing why regularization watches the validation curve rather than training loss alone.</desc>
  <rect width="920" height="430" fill="#ffffff"/>
  <text x="40" y="42" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#172033">Regularization watches the gap, not training loss alone</text>
  <text x="40" y="70" font-family="Arial, sans-serif" font-size="15" fill="#475569">Overfitting often appears when training loss keeps improving while validation loss starts to worsen.</text>

  <line x1="88" y1="342" x2="850" y2="342" stroke="#94a3b8" stroke-width="2"/>
  <line x1="88" y1="342" x2="88" y2="98" stroke="#94a3b8" stroke-width="2"/>
  <text x="802" y="374" font-family="Arial, sans-serif" font-size="14" fill="#475569">training step</text>
  <text x="30" y="108" font-family="Arial, sans-serif" font-size="14" fill="#475569" transform="rotate(-90 30 108)">loss</text>

  <path d="M112 118 C190 172, 270 216, 360 252 C480 299, 610 320, 826 332" fill="none" stroke="#2563eb" stroke-width="4"/>
  <path d="M112 152 C196 210, 282 250, 382 270 C470 288, 560 268, 662 224 C736 192, 790 166, 832 152" fill="none" stroke="#dc2626" stroke-width="4"/>

  <line x1="438" y1="342" x2="438" y2="100" stroke="#64748b" stroke-width="1.8" stroke-dasharray="6 6"/>
  <circle cx="438" cy="280" r="7" fill="#dc2626"/>
  <text x="456" y="278" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#991b1b">validation turns</text>
  <text x="456" y="296" font-family="Arial, sans-serif" font-size="13" fill="#991b1b">overfit risk grows</text>

  <rect x="640" y="102" width="214" height="74" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <line x1="660" y1="126" x2="705" y2="126" stroke="#2563eb" stroke-width="4"/>
  <text x="716" y="131" font-family="Arial, sans-serif" font-size="14" fill="#334155">training loss</text>
  <line x1="660" y1="154" x2="705" y2="154" stroke="#dc2626" stroke-width="4"/>
  <text x="716" y="159" font-family="Arial, sans-serif" font-size="14" fill="#334155">validation loss</text>

  <rect x="92" y="386" width="748" height="28" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="118" y="405" font-family="Arial, sans-serif" font-size="14" fill="#334155">Reading point: regularization is useful when lower training loss no longer means better generalization.</text>
</svg>
