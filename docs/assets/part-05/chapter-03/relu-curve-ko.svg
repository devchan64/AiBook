<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
  <title id="title">ReLU 활성화 함수 곡선</title>
  <desc id="desc">음수 점수는 0으로 만들고 양수 점수는 a=z로 통과시키는 ReLU 곡선이다.</desc>
  <defs><style>.bg{fill:#f8fafc}.panel{fill:#fff;stroke:#cbd5e1;stroke-width:1.5}.grid{stroke:#e2e8f0}.axis{stroke:#475569;stroke-width:1.8}.curve{fill:none;stroke:#dc2626;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.guide{stroke:#94a3b8;stroke-width:1.4;stroke-dasharray:5 5}.title{font:700 22px sans-serif;fill:#0f172a}.text{font:400 14px sans-serif;fill:#334155}.tick{font:12px sans-serif;fill:#64748b}.label{font:700 14px sans-serif;fill:#334155}.point{fill:#dc2626;stroke:#fff;stroke-width:2}</style></defs>
  <rect class="bg" width="640" height="360" rx="24"/>
  <text class="title" x="34" y="42">ReLU: a = max(0, z)</text>
  <text class="text" x="34" y="66">음수 차단과 양수 통과 곡선으로 읽습니다.</text>
  <rect class="panel" x="46" y="88" width="380" height="230" rx="16"/>
  <line class="grid" x1="86" y1="278" x2="390" y2="278"/><line class="grid" x1="86" y1="228" x2="390" y2="228"/><line class="grid" x1="86" y1="178" x2="390" y2="178"/><line class="grid" x1="86" y1="128" x2="390" y2="128"/>
  <line class="axis" x1="86" y1="278" x2="390" y2="278"/><line class="axis" x1="238" y1="278" x2="238" y2="88"/>
  <line class="guide" x1="238" y1="278" x2="238" y2="88"/>
  <path class="curve" d="M86 278 L238 278 L390 118"/>
  <circle class="point" cx="238" cy="278" r="5"/>
  <text class="tick" x="78" y="298">-4</text><text class="tick" x="232" y="298">0</text><text class="tick" x="382" y="298">4</text>
  <text class="tick" x="58" y="282">0</text><text class="tick" x="58" y="232">1</text><text class="tick" x="58" y="182">2</text><text class="tick" x="58" y="132">3</text>
  <text class="label" x="380" y="302">z</text><text class="label" x="246" y="106">a</text>
  <text class="text" x="452" y="138">z &lt; 0 -> a = 0</text>
  <text class="text" x="452" y="198">z = 0 -> a = 0</text>
  <text class="text" x="452" y="258">z &gt; 0 -> a = z</text>
</svg>
