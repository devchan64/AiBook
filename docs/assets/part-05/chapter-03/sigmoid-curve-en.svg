<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
  <title id="title">Sigmoid activation curve</title>
  <desc id="desc">A sigmoid curve mapping score z to output a between 0 and 1. Large negative scores approach 0, z equals 0 maps to 0.5, and large positive scores approach 1.</desc>
  <defs>
    <style>
      .bg{fill:#f8fafc}.panel{fill:#fff;stroke:#cbd5e1;stroke-width:1.5}.grid{stroke:#e2e8f0}.axis{stroke:#475569;stroke-width:1.8}.curve{fill:none;stroke:#2563eb;stroke-width:5;stroke-linecap:round}.guide{stroke:#94a3b8;stroke-width:1.4;stroke-dasharray:5 5}.title{font:700 22px sans-serif;fill:#0f172a}.text{font:400 14px sans-serif;fill:#334155}.tick{font:12px sans-serif;fill:#64748b}.label{font:700 14px sans-serif;fill:#334155}.point{fill:#2563eb;stroke:#fff;stroke-width:2}
    </style>
  </defs>
  <rect class="bg" width="640" height="360" rx="24"/>
  <text class="title" x="34" y="42">Sigmoid: a = 1 / (1 + e^-z)</text>
  <text class="text" x="34" y="66">Read the curve as compression into the 0-to-1 range.</text>
  <rect class="panel" x="46" y="88" width="380" height="230" rx="16"/>
  <line class="grid" x1="86" y1="278" x2="390" y2="278"/><line class="grid" x1="86" y1="228" x2="390" y2="228"/><line class="grid" x1="86" y1="178" x2="390" y2="178"/><line class="grid" x1="86" y1="128" x2="390" y2="128"/>
  <line class="axis" x1="86" y1="278" x2="390" y2="278"/><line class="axis" x1="86" y1="278" x2="86" y2="108"/>
  <line class="guide" x1="238" y1="278" x2="238" y2="108"/><line class="guide" x1="86" y1="178" x2="390" y2="178"/>
  <path class="curve" d="M86 268 C130 263, 169 246, 202 208 C216 192, 228 182, 238 178 C248 174, 260 164, 274 148 C307 110, 346 93, 390 88"/>
  <circle class="point" cx="238" cy="178" r="5"/>
  <text class="tick" x="78" y="298">-4</text><text class="tick" x="232" y="298">0</text><text class="tick" x="382" y="298">4</text>
  <text class="tick" x="58" y="282">0</text><text class="tick" x="50" y="182">0.5</text><text class="tick" x="58" y="132">1</text>
  <text class="label" x="380" y="302">z</text><text class="label" x="94" y="118">a</text>
  <text class="text" x="452" y="128">z &lt; 0</text><text class="text" x="452" y="150">approaches 0</text>
  <text class="text" x="452" y="198">z = 0 -> a = 0.5</text>
  <text class="text" x="452" y="248">z &gt; 0</text><text class="text" x="452" y="270">approaches 1</text>
</svg>
