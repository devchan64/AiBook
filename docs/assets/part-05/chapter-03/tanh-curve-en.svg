<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
  <title id="title">tanh activation curve</title>
  <desc id="desc">A tanh curve mapping score z to output a between -1 and 1. Negative scores remain negative, z equals 0 maps to 0, and positive scores remain positive.</desc>
  <defs><style>.bg{fill:#f8fafc}.panel{fill:#fff;stroke:#cbd5e1;stroke-width:1.5}.grid{stroke:#e2e8f0}.axis{stroke:#475569;stroke-width:1.8}.curve{fill:none;stroke:#059669;stroke-width:5;stroke-linecap:round}.guide{stroke:#94a3b8;stroke-width:1.4;stroke-dasharray:5 5}.title{font:700 22px sans-serif;fill:#0f172a}.text{font:400 14px sans-serif;fill:#334155}.tick{font:12px sans-serif;fill:#64748b}.label{font:700 14px sans-serif;fill:#334155}.point{fill:#059669;stroke:#fff;stroke-width:2}</style></defs>
  <rect class="bg" width="640" height="360" rx="24"/>
  <text class="title" x="34" y="42">tanh: a = tanh(z)</text>
  <text class="text" x="34" y="66">Read the curve as zero-centered compression.</text>
  <rect class="panel" x="46" y="88" width="380" height="230" rx="16"/>
  <line class="grid" x1="86" y1="278" x2="390" y2="278"/><line class="grid" x1="86" y1="228" x2="390" y2="228"/><line class="grid" x1="86" y1="178" x2="390" y2="178"/><line class="grid" x1="86" y1="128" x2="390" y2="128"/>
  <line class="axis" x1="86" y1="178" x2="390" y2="178"/><line class="axis" x1="238" y1="278" x2="238" y2="88"/>
  <line class="guide" x1="238" y1="278" x2="238" y2="88"/>
  <path class="curve" d="M86 268 C132 267, 166 252, 198 218 C219 196, 231 181, 238 178 C245 175, 257 160, 278 138 C310 104, 344 89, 390 88"/>
  <circle class="point" cx="238" cy="178" r="5"/>
  <text class="tick" x="78" y="298">-4</text><text class="tick" x="232" y="298">0</text><text class="tick" x="382" y="298">4</text>
  <text class="tick" x="54" y="282">-1</text><text class="tick" x="58" y="182">0</text><text class="tick" x="62" y="132">1</text>
  <text class="label" x="380" y="198">z</text><text class="label" x="246" y="106">a</text>
  <text class="text" x="452" y="128">z &lt; 0</text><text class="text" x="452" y="150">negative signal remains</text>
  <text class="text" x="452" y="198">z = 0 -> a = 0</text>
  <text class="text" x="452" y="248">z &gt; 0</text><text class="text" x="452" y="270">positive signal remains</text>
</svg>
