<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="title desc">
  <title id="title">시그모이드, tanh, ReLU 활성화 함수 곡선 비교</title>
  <desc id="desc">sigmoid, tanh, ReLU의 함수 모양을 세 패널로 비교한 차트다. sigmoid는 0과 1로 압축하고, tanh는 0을 중심으로 -1과 1 사이로 압축하며, ReLU는 음수를 0으로 자르고 양수를 선형으로 통과시킨다.</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
      .title { font: 700 18px sans-serif; fill: #0f172a; }
      .subtitle { font: 400 12px sans-serif; fill: #475569; }
      .axis { stroke: #64748b; stroke-width: 1.6; }
      .grid { stroke: #e2e8f0; stroke-width: 1; }
      .tick { font: 12px sans-serif; fill: #475569; }
      .label { font: 700 13px sans-serif; fill: #334155; }
      .curve-sigmoid { fill: none; stroke: #2563eb; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      .curve-tanh { fill: none; stroke: #059669; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      .curve-relu { fill: none; stroke: #dc2626; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      .note { font: 400 13px sans-serif; fill: #334155; }
      .formula { font: 600 12px sans-serif; fill: #0f172a; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="960" height="460" rx="24" />

  <text class="title" x="40" y="38">대표 활성화 함수 곡선</text>
  <text class="subtitle" x="40" y="60">모양부터 읽습니다: 출력 압축 범위, 0 중심 여부, 음수 절단 여부.</text>

  <g transform="translate(28 92)">
    <rect class="panel" x="0" y="0" width="286" height="320" rx="16" />
    <text class="title" x="18" y="30">Sigmoid</text>
    <text class="formula" x="18" y="50">y = 1 / (1 + e^-x)</text>
    <text class="subtitle" x="18" y="70">0과 1로 압축</text>

    <line class="grid" x1="44" y1="90" x2="252" y2="90" />
    <line class="grid" x1="44" y1="140" x2="252" y2="140" />
    <line class="grid" x1="44" y1="190" x2="252" y2="190" />
    <line class="grid" x1="44" y1="240" x2="252" y2="240" />
    <line class="grid" x1="44" y1="290" x2="252" y2="290" />
    <line class="grid" x1="44" y1="90" x2="44" y2="290" />
    <line class="grid" x1="96" y1="90" x2="96" y2="290" />
    <line class="grid" x1="148" y1="90" x2="148" y2="290" />
    <line class="grid" x1="200" y1="90" x2="200" y2="290" />
    <line class="grid" x1="252" y1="90" x2="252" y2="290" />

    <line class="axis" x1="44" y1="290" x2="252" y2="290" />
    <line class="axis" x1="44" y1="290" x2="44" y2="90" />

    <text class="tick" x="38" y="304">-4</text>
    <text class="tick" x="91" y="304">-2</text>
    <text class="tick" x="144" y="304">0</text>
    <text class="tick" x="195" y="304">2</text>
    <text class="tick" x="247" y="304">4</text>

    <text class="tick" x="16" y="294">0</text>
    <text class="tick" x="16" y="244">0.25</text>
    <text class="tick" x="16" y="194">0.5</text>
    <text class="tick" x="16" y="144">0.75</text>
    <text class="tick" x="16" y="94">1</text>

    <path class="curve-sigmoid" d="M44 286 C62 284, 76 280, 90 272 C108 260, 120 242, 132 220 C140 206, 144 197, 148 190 C152 183, 156 174, 164 160 C176 138, 188 120, 206 108 C220 100, 234 96, 252 94" />

    <text class="label" x="244" y="318">x</text>
    <text class="label" x="24" y="102">y</text>
    <text class="note" x="18" y="338">큰 음수는 0 근처에 머뭅니다.</text>
    <text class="note" x="18" y="356">큰 양수는 1 근처에 머뭅니다.</text>
  </g>

  <g transform="translate(337 92)">
    <rect class="panel" x="0" y="0" width="286" height="320" rx="16" />
    <text class="title" x="18" y="30">Tanh</text>
    <text class="formula" x="18" y="50">y = tanh(x)</text>
    <text class="subtitle" x="18" y="70">0 중심 압축</text>

    <line class="grid" x1="44" y1="90" x2="252" y2="90" />
    <line class="grid" x1="44" y1="140" x2="252" y2="140" />
    <line class="grid" x1="44" y1="190" x2="252" y2="190" />
    <line class="grid" x1="44" y1="240" x2="252" y2="240" />
    <line class="grid" x1="44" y1="290" x2="252" y2="290" />
    <line class="grid" x1="44" y1="90" x2="44" y2="290" />
    <line class="grid" x1="96" y1="90" x2="96" y2="290" />
    <line class="grid" x1="148" y1="90" x2="148" y2="290" />
    <line class="grid" x1="200" y1="90" x2="200" y2="290" />
    <line class="grid" x1="252" y1="90" x2="252" y2="290" />

    <line class="axis" x1="44" y1="190" x2="252" y2="190" />
    <line class="axis" x1="148" y1="290" x2="148" y2="90" />

    <text class="tick" x="38" y="304">-4</text>
    <text class="tick" x="91" y="304">-2</text>
    <text class="tick" x="144" y="304">0</text>
    <text class="tick" x="195" y="304">2</text>
    <text class="tick" x="247" y="304">4</text>

    <text class="tick" x="18" y="294">-1</text>
    <text class="tick" x="18" y="244">-0.5</text>
    <text class="tick" x="28" y="194">0</text>
    <text class="tick" x="18" y="144">0.5</text>
    <text class="tick" x="22" y="94">1</text>

    <path class="curve-tanh" d="M44 286 C64 286, 80 282, 96 266 C116 244, 128 220, 140 200 C144 194, 146 191, 148 190 C150 189, 152 186, 156 180 C168 160, 180 136, 200 114 C216 98, 232 94, 252 94" />

    <text class="label" x="244" y="318">x</text>
    <text class="label" x="156" y="104">y</text>
    <text class="note" x="18" y="338">음수와 양수 부호가 모두 남습니다.</text>
    <text class="note" x="18" y="356">중심은 0 근처에 있습니다.</text>
  </g>

  <g transform="translate(646 92)">
    <rect class="panel" x="0" y="0" width="286" height="320" rx="16" />
    <text class="title" x="18" y="30">ReLU</text>
    <text class="formula" x="18" y="50">y = max(0, x)</text>
    <text class="subtitle" x="18" y="70">음수 절단, 양수 선형 통과</text>

    <line class="grid" x1="44" y1="90" x2="252" y2="90" />
    <line class="grid" x1="44" y1="140" x2="252" y2="140" />
    <line class="grid" x1="44" y1="190" x2="252" y2="190" />
    <line class="grid" x1="44" y1="240" x2="252" y2="240" />
    <line class="grid" x1="44" y1="290" x2="252" y2="290" />
    <line class="grid" x1="44" y1="90" x2="44" y2="290" />
    <line class="grid" x1="96" y1="90" x2="96" y2="290" />
    <line class="grid" x1="148" y1="90" x2="148" y2="290" />
    <line class="grid" x1="200" y1="90" x2="200" y2="290" />
    <line class="grid" x1="252" y1="90" x2="252" y2="290" />

    <line class="axis" x1="44" y1="190" x2="252" y2="190" />
    <line class="axis" x1="148" y1="290" x2="148" y2="90" />

    <text class="tick" x="38" y="304">-4</text>
    <text class="tick" x="91" y="304">-2</text>
    <text class="tick" x="144" y="304">0</text>
    <text class="tick" x="195" y="304">2</text>
    <text class="tick" x="247" y="304">4</text>

    <text class="tick" x="22" y="294">-2</text>
    <text class="tick" x="22" y="244">-1</text>
    <text class="tick" x="28" y="194">0</text>
    <text class="tick" x="28" y="144">1</text>
    <text class="tick" x="28" y="94">2</text>

    <path class="curve-relu" d="M44 190 L148 190 L252 90" />

    <text class="label" x="244" y="318">x</text>
    <text class="label" x="156" y="104">y</text>
    <text class="note" x="18" y="338">0보다 작은 값은 모두 0이 됩니다.</text>
    <text class="note" x="18" y="356">양수는 크기를 유지한 채 전달됩니다.</text>
  </g>
</svg>
