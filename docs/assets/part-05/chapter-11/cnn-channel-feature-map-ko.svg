<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 820" role="img" aria-labelledby="title desc">
  <title id="title">하나의 CNN 필터가 모든 입력 채널을 함께 읽고 하나의 특징 맵을 만든다</title>
  <desc id="desc">단순화한 세 채널 이미지 패치를 빨강, 초록, 파랑 격자로 나눈다. 각 채널은 자기 필터 조각과 반응하고, 세 부분 반응을 더해 하나의 특징 맵을 만든다.</desc>
