<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 820" role="img" aria-labelledby="title desc">
  <title id="title">One CNN filter reads every input channel together and makes one feature map</title>
  <desc id="desc">A simplified three-channel image patch is split into red, green, and blue grids. Each channel reacts with its own filter slice, and the three partial responses are added into one feature map.</desc>
