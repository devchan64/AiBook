<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 430" role="img" aria-labelledby="title desc">
  <title id="title">Linear boundary and XOR limitation</title>
  <desc id="desc">A two-panel coordinate chart comparing a linearly separable point pattern with the XOR point pattern, showing that one straight boundary can separate the first but cannot cleanly separate XOR.</desc>
  <rect width="920" height="430" fill="#ffffff"/>
  <text x="40" y="42" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#172033">A perceptron draws one straight boundary</text>
  <text x="40" y="70" font-family="Arial, sans-serif" font-size="15" fill="#475569">Some point patterns are separated by one line; XOR needs more than one straight boundary.</text>

  <rect x="54" y="104" width="382" height="260" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="78" y="134" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#172033">Linearly separable</text>
  <line x1="110" y1="314" x2="380" y2="314" stroke="#94a3b8" stroke-width="2"/>
  <line x1="110" y1="314" x2="110" y2="154" stroke="#94a3b8" stroke-width="2"/>
  <path d="M132 286 L358 166" stroke="#0f766e" stroke-width="4"/>
  <text x="270" y="178" font-family="Arial, sans-serif" font-size="13" fill="#0f766e">one line works</text>
  <circle cx="158" cy="276" r="9" fill="#2563eb"/>
  <circle cx="198" cy="255" r="9" fill="#2563eb"/>
  <circle cx="238" cy="238" r="9" fill="#2563eb"/>
  <circle cx="286" cy="210" r="9" fill="#dc2626"/>
  <circle cx="324" cy="188" r="9" fill="#dc2626"/>
  <circle cx="348" cy="230" r="9" fill="#dc2626"/>
  <text x="150" y="344" font-family="Arial, sans-serif" font-size="13" fill="#334155">class 0</text>
  <text x="308" y="344" font-family="Arial, sans-serif" font-size="13" fill="#334155">class 1</text>

  <rect x="484" y="104" width="382" height="260" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="508" y="134" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#172033">XOR pattern</text>
  <line x1="540" y1="314" x2="810" y2="314" stroke="#94a3b8" stroke-width="2"/>
  <line x1="540" y1="314" x2="540" y2="154" stroke="#94a3b8" stroke-width="2"/>
  <path d="M558 286 L794 166" stroke="#64748b" stroke-width="3" stroke-dasharray="7 6"/>
  <path d="M558 178 L794 298" stroke="#64748b" stroke-width="3" stroke-dasharray="7 6"/>
  <text x="650" y="166" font-family="Arial, sans-serif" font-size="13" fill="#64748b">one line fails</text>
  <circle cx="580" cy="286" r="10" fill="#2563eb"/>
  <circle cx="770" cy="170" r="10" fill="#2563eb"/>
  <circle cx="580" cy="170" r="10" fill="#dc2626"/>
  <circle cx="770" cy="286" r="10" fill="#dc2626"/>
  <text x="568" y="342" font-family="Arial, sans-serif" font-size="13" fill="#334155">(0,0)</text>
  <text x="758" y="342" font-family="Arial, sans-serif" font-size="13" fill="#334155">(1,0)</text>
  <text x="568" y="152" font-family="Arial, sans-serif" font-size="13" fill="#334155">(0,1)</text>
  <text x="758" y="152" font-family="Arial, sans-serif" font-size="13" fill="#334155">(1,1)</text>

  <rect x="92" y="386" width="736" height="28" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="118" y="405" font-family="Arial, sans-serif" font-size="14" fill="#334155">Reading point: the XOR rule is simple in a table, but not simple for a single straight boundary.</text>
</svg>
