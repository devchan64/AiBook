<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 430" role="img" aria-labelledby="title desc">
  <title id="title">학습률과 손실 곡선 위 보폭</title>
  <desc id="desc">같은 기울기 방향을 얻어도 학습률이 너무 작으면 천천히 움직이고, 적절하면 낮은 손실 지점 근처로 가며, 너무 크면 목표를 지나쳐 손실이 다시 커질 수 있음을 보여 주는 좌표 그래프.</desc>
  <rect width="920" height="430" fill="#ffffff"/>
  <text x="40" y="42" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#172033">같은 gradient, 다른 learning rate</text>
  <text x="40" y="70" font-family="Arial, sans-serif" font-size="15" fill="#475569">gradient는 내려갈 방향을 주고, learning rate는 한 번에 얼마나 움직일지 정합니다.</text>

  <line x1="88" y1="342" x2="850" y2="342" stroke="#94a3b8" stroke-width="2"/>
  <line x1="88" y1="342" x2="88" y2="98" stroke="#94a3b8" stroke-width="2"/>
  <text x="812" y="374" font-family="Arial, sans-serif" font-size="14" fill="#475569">파라미터</text>
  <text x="30" y="108" font-family="Arial, sans-serif" font-size="14" fill="#475569" transform="rotate(-90 30 108)">손실</text>

  <path d="M110 118 C210 224, 300 310, 428 330 C520 344, 608 300, 710 206 C760 160, 806 124, 844 112" fill="none" stroke="#0f766e" stroke-width="4"/>
  <line x1="476" y1="342" x2="476" y2="93" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5 5"/>
  <text x="424" y="365" font-family="Arial, sans-serif" font-size="13" fill="#475569">손실이 낮은 근처</text>

  <circle cx="224" cy="248" r="8" fill="#1d4ed8"/>
  <text x="188" y="232" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#1d4ed8">현재 위치</text>

  <line x1="224" y1="248" x2="310" y2="293" stroke="#64748b" stroke-width="3" marker-end="url(#arrow-gray)"/>
  <circle cx="310" cy="293" r="7" fill="#64748b"/>
  <text x="246" y="322" font-family="Arial, sans-serif" font-size="14" fill="#334155">너무 작음</text>
  <text x="246" y="340" font-family="Arial, sans-serif" font-size="13" fill="#64748b">느리게 전진</text>

  <line x1="224" y1="248" x2="470" y2="330" stroke="#16a34a" stroke-width="3" marker-end="url(#arrow-green)"/>
  <circle cx="470" cy="330" r="7" fill="#16a34a"/>
  <text x="426" y="286" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#166534">적절함</text>
  <text x="426" y="304" font-family="Arial, sans-serif" font-size="13" fill="#166534">목표 근처</text>

  <line x1="224" y1="248" x2="748" y2="170" stroke="#dc2626" stroke-width="3" marker-end="url(#arrow-red)"/>
  <circle cx="748" cy="170" r="7" fill="#dc2626"/>
  <text x="704" y="198" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#991b1b">너무 큼</text>
  <text x="704" y="216" font-family="Arial, sans-serif" font-size="13" fill="#991b1b">지나침</text>

  <rect x="92" y="386" width="736" height="28" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="118" y="405" font-family="Arial, sans-serif" font-size="14" fill="#334155">읽을 점: 방향이 맞아도 보폭이 너무 작거나 크면 학습 결과는 달라질 수 있습니다.</text>

  <defs>
    <marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#16a34a"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#dc2626"/>
    </marker>
  </defs>
</svg>
