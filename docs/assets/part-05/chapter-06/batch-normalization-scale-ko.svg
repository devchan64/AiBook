<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 430" role="img" aria-labelledby="title desc">
  <title id="title">batch normalization 전후 출력 스케일</title>
  <desc id="desc">작은 초기화 출력, 큰 초기화 출력, batch normalization 뒤 출력 위치를 한 축 위에서 비교해, batch normalization이 퍼진 활성값 분포를 다시 중심 근처의 다루기 쉬운 범위로 옮긴다는 점을 보여 주는 좌표 그래프.</desc>
  <rect width="920" height="430" fill="#ffffff"/>
  <text x="40" y="42" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#172033">초기화는 스케일을 바꾸고, batch normalization은 다시 정리한다</text>
  <text x="40" y="70" font-family="Arial, sans-serif" font-size="15" fill="#475569">중요한 변화는 값을 없애는 것이 아니라, 다루기 어려운 퍼짐을 다음 층이 보기 쉬운 범위로 옮기는 것입니다.</text>
  <line x1="80" y1="228" x2="840" y2="228" stroke="#94a3b8" stroke-width="2"/>
  <text x="812" y="252" font-family="Arial, sans-serif" font-size="14" fill="#475569">활성값</text>
  <line x1="460" y1="100" x2="460" y2="330" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5 5"/>
  <text x="451" y="348" font-family="Arial, sans-serif" font-size="13" fill="#64748b">0</text>

  <text x="84" y="128" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#172033">작은 초기화</text>
  <circle cx="460" cy="150" r="8" fill="#2563eb"/>
  <circle cx="490" cy="150" r="8" fill="#2563eb"/>
  <circle cx="440" cy="150" r="8" fill="#2563eb"/>
  <line x1="430" y1="150" x2="500" y2="150" stroke="#2563eb" stroke-width="2" opacity="0.35"/>
  <text x="520" y="155" font-family="Arial, sans-serif" font-size="13" fill="#1d4ed8">0 근처, 좁은 범위</text>

  <text x="84" y="224" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#172033">큰 초기화</text>
  <circle cx="360" cy="228" r="9" fill="#dc2626"/>
  <circle cx="780" cy="228" r="9" fill="#dc2626"/>
  <circle cx="240" cy="228" r="9" fill="#dc2626"/>
  <line x1="240" y1="228" x2="780" y2="228" stroke="#dc2626" stroke-width="3" opacity="0.25"/>
  <text x="602" y="214" font-family="Arial, sans-serif" font-size="13" fill="#991b1b">크게 퍼진 불안정한 스케일</text>

  <text x="84" y="320" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#172033">batch norm 뒤</text>
  <circle cx="446" cy="306" r="8" fill="#16a34a"/>
  <circle cx="588" cy="306" r="8" fill="#16a34a"/>
  <circle cx="347" cy="306" r="8" fill="#16a34a"/>
  <line x1="347" y1="306" x2="588" y2="306" stroke="#16a34a" stroke-width="3" opacity="0.25"/>
  <text x="612" y="311" font-family="Arial, sans-serif" font-size="13" fill="#166534">중심과 퍼짐을 다시 정리</text>

  <path d="M780 238 C732 266, 660 292, 596 302" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="660" y="278" font-family="Arial, sans-serif" font-size="13" fill="#475569">정규화</text>

  <rect x="86" y="382" width="748" height="28" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="112" y="401" font-family="Arial, sans-serif" font-size="14" fill="#334155">읽을 점: batch normalization은 목표 함수가 아니라 다음 층에 넘기는 활성값 분포를 바꿉니다.</text>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
  </defs>
</svg>
