<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 500" role="img" aria-labelledby="title desc">
  <title id="title">Different loss-reading axes by problem type</title>
  <desc id="desc">A three-panel chart showing that regression, classification, and generation losses are read along different horizontal axes: target distance, true class probability, and true token probability across positions.</desc>
  <rect width="920" height="500" fill="#ffffff"/>
  <text x="460" y="36" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#1f2933">Do not read all loss numbers on the same axis</text>

  <rect x="40" y="78" width="260" height="330" rx="18" fill="#f7fafc" stroke="#d8e2ec"/>
  <text x="170" y="112" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#243b53">Regression</text>
  <line x1="84" y1="308" x2="260" y2="308" stroke="#52606d" stroke-width="2"/>
  <line x1="172" y1="308" x2="172" y2="154" stroke="#52606d" stroke-width="2"/>
  <path d="M90 172 C116 244 144 296 172 308 C206 292 232 244 256 172" fill="none" stroke="#2563eb" stroke-width="4"/>
  <text x="172" y="333" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#52606d">distance from target</text>
  <text x="170" y="366" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#334e68">The farther the number is from the target, the worse it is.</text>

  <rect x="330" y="78" width="260" height="330" rx="18" fill="#f7fafc" stroke="#d8e2ec"/>
  <text x="460" y="112" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#243b53">Classification</text>
  <line x1="374" y1="308" x2="550" y2="308" stroke="#52606d" stroke-width="2"/>
  <line x1="374" y1="308" x2="374" y2="154" stroke="#52606d" stroke-width="2"/>
  <path d="M384 166 C408 218 438 260 474 286 C502 302 526 306 546 307" fill="none" stroke="#dc2626" stroke-width="4"/>
  <text x="462" y="333" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#52606d">probability of the true class</text>
  <text x="460" y="366" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#334e68">The lower the true-class confidence, the worse it is.</text>

  <rect x="620" y="78" width="260" height="330" rx="18" fill="#f7fafc" stroke="#d8e2ec"/>
  <text x="750" y="112" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#243b53">Generation</text>
  <line x1="664" y1="308" x2="840" y2="308" stroke="#52606d" stroke-width="2"/>
  <line x1="664" y1="308" x2="664" y2="154" stroke="#52606d" stroke-width="2"/>
  <rect x="690" y="184" width="26" height="124" fill="#dc2626" opacity="0.85"/>
  <rect x="728" y="236" width="26" height="72" fill="#f97316" opacity="0.85"/>
  <rect x="766" y="204" width="26" height="104" fill="#dc2626" opacity="0.85"/>
  <rect x="804" y="274" width="26" height="34" fill="#0f766e" opacity="0.85"/>
  <text x="752" y="333" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#52606d">true token probability by position</text>
  <text x="750" y="366" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#334e68">Weak true-token probabilities accumulate across positions.</text>

  <text x="460" y="454" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#334e68">Compare predictions inside the same problem type first. Cross-type loss numbers do not share one simple unit.</text>
</svg>
