<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 520" role="img" aria-labelledby="title desc">
  <!-- zh localized asset -->
  <title id="title">把估计值与真实值之间的差读成误差的图</title>
  <desc id="desc">把估计值与真实值之间的差读成误差的图</desc>
  <rect width="920" height="520" fill="#ffffff"/>
  <text x="42" y="48" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#111827">不知道真实值时，估计很有用</text>
  <text x="42" y="82" font-family="Arial, sans-serif" font-size="16" fill="#4b5563">误差是估计值和整体真实值之间的差。</text>

  <line x1="105" y1="300" x2="815" y2="300" stroke="#94a3b8" stroke-width="2"/>
  <line x1="460" y1="168" x2="460" y2="342" stroke="#10b981" stroke-width="4"/>
  <text x="410" y="156" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#047857">真实值</text>

  <line x1="385" y1="208" x2="385" y2="342" stroke="#2563eb" stroke-width="3" stroke-dasharray="8 6"/>
  <text x="334" y="198" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#1d4ed8">估计 A</text>

  <line x1="520" y1="208" x2="520" y2="342" stroke="#2563eb" stroke-width="3" stroke-dasharray="8 6"/>
  <text x="470" y="198" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#1d4ed8">估计 B</text>

  <path d="M385 374 L460 374" stroke="#ef4444" stroke-width="4" stroke-linecap="round"/>
  <polygon points="385,374 399,366 399,382" fill="#ef4444"/>
  <polygon points="460,374 446,366 446,382" fill="#ef4444"/>
  <text x="388" y="410" font-family="Arial, sans-serif" font-size="16" fill="#b91c1c">误差</text>

  <path d="M460 430 L520 430" stroke="#ef4444" stroke-width="4" stroke-linecap="round"/>
  <polygon points="460,430 474,422 474,438" fill="#ef4444"/>
  <polygon points="520,430 506,422 506,438" fill="#ef4444"/>
  <text x="466" y="466" font-family="Arial, sans-serif" font-size="16" fill="#b91c1c">误差</text>

  <rect x="610" y="150" width="250" height="132" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="636" y="184" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#334155">为什么有两个估计？</text>
  <text x="636" y="216" font-family="Arial, sans-serif" font-size="15" fill="#475569">不同样本可能产生</text>
  <text x="636" y="240" font-family="Arial, sans-serif" font-size="15" fill="#475569">不同的估计值。</text>
  <text x="636" y="264" font-family="Arial, sans-serif" font-size="15" fill="#475569">这种波动很自然。</text>
</svg>
