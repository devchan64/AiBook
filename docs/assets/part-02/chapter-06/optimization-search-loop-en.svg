<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 620" role="img" aria-labelledby="title desc">
<title id="title">Compare two candidate lines</title>
<desc id="desc">The same observations are used to compare two parameter combinations, predictions and mean squared errors.</desc>
<rect width="680" height="620" fill="white"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#64748b"/></marker></defs>
<g font-family="Noto Sans CJK JP, sans-serif" fill="#1e293b">
<rect x="40" y="20" width="600" height="120" rx="10" fill="#f8fafc" stroke="#94a3b8"/>
<text x="68" y="51" font-size="20" font-weight="700">1. Parameter combinations</text>
<text x="68" y="85" font-size="19">Candidate 1: a = 10, b = 45</text>
<text x="68" y="114" font-size="19">Candidate 2: a = 12, b = 40</text>
<path d="M340 140 V162" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="170" width="600" height="120" rx="10" fill="#f8fafc" stroke="#94a3b8"/>
<text x="68" y="201" font-size="20" font-weight="700">2. Predictions at x = 1, 2, 3, 4</text>
<text x="68" y="235" font-size="19">Candidate 1: 55, 65, 75, 85</text>
<text x="68" y="264" font-size="19">Candidate 2: 52, 64, 76, 88</text>
<path d="M340 290 V312" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="320" width="600" height="120" rx="10" fill="#f8fafc" stroke="#94a3b8"/>
<text x="68" y="351" font-size="20" font-weight="700">3. Mean squared error</text>
<text x="68" y="385" font-size="19">Candidate 1: 12.5</text>
<text x="68" y="414" font-size="19">Candidate 2: 7.5</text>
<path d="M340 440 V462" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="470" width="600" height="120" rx="10" fill="#f0fdf4" stroke="#94a3b8"/>
<text x="68" y="501" font-size="20" font-weight="700">4. Better of these two candidates</text>
<text x="68" y="535" font-size="19">a = 12, b = 40</text>
<text x="68" y="564" font-size="19">7.5 &lt; 12.5</text>
</g>
</svg>
