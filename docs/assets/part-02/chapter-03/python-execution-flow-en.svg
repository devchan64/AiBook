<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 430" role="img" aria-labelledby="title desc">
  <title id="title">Execution flow for installation commands and Python code</title>
  <desc id="desc">A flowchart starts with asking what kind of task is being done, then splits into installing a package or running Python code. Installation goes to either a Colab code cell with percent pip install numpy or a local terminal with python dash m pip install numpy, while running code goes to Python code with import numpy as np.</desc>
  <defs>
    <style>
      .bg { fill: #f7f4ee; }
      .box { fill: #fffdf8; stroke: #3f3a34; stroke-width: 2; rx: 18; ry: 18; }
      .accent { fill: #e8f0e3; stroke: #2f6b3b; stroke-width: 2; rx: 18; ry: 18; }
      .text { fill: #1f1b16; font-family: "Helvetica Neue", Arial, sans-serif; font-size: 24px; text-anchor: middle; }
      .small { font-size: 21px; }
      .code { font-family: "Menlo", "Consolas", monospace; font-size: 20px; }
      .arrow { stroke: #5c5248; stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5c5248"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="920" height="430"/>

  <rect class="box" x="310" y="34" width="300" height="68"/>
  <text class="text" x="460" y="76">what am I doing?</text>

  <rect class="box" x="120" y="152" width="250" height="76"/>
  <text class="text" x="245" y="198">install a package</text>

  <rect class="box" x="550" y="152" width="250" height="76"/>
  <text class="text" x="675" y="198">run Python code</text>

  <rect class="accent" x="40" y="290" width="260" height="92"/>
  <text class="text small" x="170" y="328">Colab code cell</text>
  <text class="text code" x="170" y="360">%pip install numpy</text>

  <rect class="accent" x="330" y="290" width="260" height="92"/>
  <text class="text small" x="460" y="328">local terminal</text>
  <text class="text code" x="460" y="360">python -m pip install numpy</text>

  <rect class="accent" x="620" y="290" width="260" height="92"/>
  <text class="text small" x="750" y="328">Python code</text>
  <text class="text code" x="750" y="360">import numpy as np</text>

  <path class="arrow" marker-end="url(#arrowhead)" d="M460 102 L245 152"/>
  <path class="arrow" marker-end="url(#arrowhead)" d="M460 102 L675 152"/>
  <path class="arrow" marker-end="url(#arrowhead)" d="M245 228 L170 290"/>
  <path class="arrow" marker-end="url(#arrowhead)" d="M245 228 L460 290"/>
  <path class="arrow" marker-end="url(#arrowhead)" d="M675 228 L750 290"/>
</svg>
