<svg xmlns="http://www.w3.org/2000/svg" width="480" height="320" viewBox="0 0 480 320" role="img" aria-labelledby="title desc">
  <title id="title">向量空间里的近点与远点</title>
  <desc id="desc">坐标图中 a 和 b 更接近，c 更远</desc>
  <rect width="480" height="320" fill="#ffffff"/>
  <line x1="70" y1="260" x2="430" y2="260" stroke="#222222" stroke-width="2"/>
  <line x1="70" y1="260" x2="70" y2="40" stroke="#222222" stroke-width="2"/>
  <polygon points="430,260 420,255 420,265" fill="#222222"/>
  <polygon points="70,40 65,50 75,50" fill="#222222"/>
  <g stroke="#d0d7de" stroke-width="1">
    <line x1="110" y1="60" x2="110" y2="260"/>
    <line x1="150" y1="60" x2="150" y2="260"/>
    <line x1="190" y1="60" x2="190" y2="260"/>
    <line x1="230" y1="60" x2="230" y2="260"/>
    <line x1="270" y1="60" x2="270" y2="260"/>
    <line x1="310" y1="60" x2="310" y2="260"/>
    <line x1="350" y1="60" x2="350" y2="260"/>
    <line x1="390" y1="60" x2="390" y2="260"/>
    <line x1="70" y1="220" x2="430" y2="220"/>
    <line x1="70" y1="180" x2="430" y2="180"/>
    <line x1="70" y1="140" x2="430" y2="140"/>
    <line x1="70" y1="100" x2="430" y2="100"/>
    <line x1="70" y1="60" x2="430" y2="60"/>
  </g>
  <g fill="#222222" font-family="sans-serif" font-size="13">
    <text x="436" y="265">x 轴</text>
    <text x="42" y="36">y 轴</text>
    <text x="105" y="278">1</text>
    <text x="145" y="278">2</text>
    <text x="185" y="278">3</text>
    <text x="225" y="278">4</text>
    <text x="265" y="278">5</text>
    <text x="305" y="278">6</text>
    <text x="345" y="278">7</text>
    <text x="385" y="278">8</text>
    <text x="52" y="224">1</text>
    <text x="52" y="184">2</text>
    <text x="52" y="144">3</text>
    <text x="52" y="104">4</text>
    <text x="52" y="64">5</text>
  </g>
  <line x1="150" y1="140" x2="158" y2="136" stroke="#2da44e" stroke-width="3" stroke-dasharray="5 4"/>
  <g>
    <circle cx="150" cy="140" r="7" fill="#1f77b4"/>
    <circle cx="158" cy="136" r="7" fill="#2da44e"/>
    <circle cx="390" cy="220" r="7" fill="#d73a49"/>
  </g>
  <g fill="#222222" font-family="sans-serif" font-size="14">
    <text x="118" y="128">a [2, 3]</text>
    <text x="166" y="128">b [2.2, 3.1]</text>
    <text x="336" y="214">c [8, 1]</text>
    <text x="126" y="92">a 和 b 更接近</text>
    <text x="304" y="88">c 更远</text>
  </g>
</svg>
