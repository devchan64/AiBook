    <text x="310" y="548" font-size="16" text-anchor="middle">-1</text>
    <text x="460" y="548" font-size="16" text-anchor="middle">0</text>
    <text x="610" y="548" font-size="16" text-anchor="middle">1</text>
    <text x="760" y="548" font-size="16" text-anchor="middle">2</text>
