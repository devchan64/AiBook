    <rect x="472" y="224" width="46" height="296"/>
    <rect x="518" y="110" width="46" height="410"/>
    <rect x="564" y="268" width="46" height="252"/>
    <rect x="610" y="320" width="46" height="200"/>
    <rect x="656" y="256" width="46" height="264"/>
