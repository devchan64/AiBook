<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="640" viewBox="0 0 1024 640" role="img" aria-labelledby="title desc">
  <title id="title">점수 분포 히스토그램</title>
  <desc id="desc">점수가 높은 구간에 더 많이 모이는 다섯 구간 히스토그램</desc>
  <rect width="1024" height="640" fill="#ffffff"/>
  <g stroke="#d1d5db" stroke-width="1">
    <line x1="110" y1="520" x2="960" y2="520"/>
    <line x1="110" y1="390" x2="960" y2="390"/>
    <line x1="110" y1="260" x2="960" y2="260"/>
    <line x1="110" y1="130" x2="960" y2="130"/>
    <line x1="150" y1="90" x2="150" y2="520"/>
    <line x1="320" y1="90" x2="320" y2="520"/>
    <line x1="490" y1="90" x2="490" y2="520"/>
    <line x1="660" y1="90" x2="660" y2="520"/>
    <line x1="830" y1="90" x2="830" y2="520"/>
    <line x1="960" y1="90" x2="960" y2="520"/>
  </g>
  <g stroke="#111827" stroke-width="2">
    <line x1="110" y1="520" x2="960" y2="520"/>
    <line x1="110" y1="90" x2="110" y2="520"/>
  </g>
  <g fill="#64748b" fill-opacity="0.9" stroke="#334155" stroke-width="2">
    <rect x="150" y="390" width="170" height="130"/>
    <rect x="320" y="390" width="170" height="130"/>
    <rect x="490" y="390" width="170" height="130"/>
    <rect x="660" y="390" width="170" height="130"/>
    <rect x="830" y="130" width="130" height="390"/>
  </g>
  <g fill="#111827" font-family="Pretendard, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
    <text x="512" y="48" font-size="28" text-anchor="middle">점수 분포</text>
    <text x="512" y="598" font-size="20" text-anchor="middle">점수</text>
    <text x="42" y="310" font-size="20" text-anchor="middle" transform="rotate(-90 42 310)">개수</text>
    <text x="150" y="548" font-size="16" text-anchor="middle">45</text>
    <text x="320" y="548" font-size="16" text-anchor="middle">55</text>
    <text x="490" y="548" font-size="16" text-anchor="middle">65</text>
    <text x="660" y="548" font-size="16" text-anchor="middle">75</text>
    <text x="830" y="548" font-size="16" text-anchor="middle">85</text>
    <text x="88" y="523" font-size="16" text-anchor="end">0</text>
    <text x="88" y="393" font-size="16" text-anchor="end">1</text>
    <text x="88" y="263" font-size="16" text-anchor="end">2</text>
    <text x="88" y="133" font-size="16" text-anchor="end">3</text>
  </g>
</svg>
