    <circle cx="350" cy="285" r="8"/>
    <circle cx="550" cy="405" r="8"/>
    <circle cx="750" cy="485" r="8"/>
    <circle cx="950" cy="505" r="8"/>
  </g>
  <g fill="#111827" font-family="Pretendard, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
