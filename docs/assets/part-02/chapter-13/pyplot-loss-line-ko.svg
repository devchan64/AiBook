<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="640" viewBox="0 0 1024 640" role="img" aria-labelledby="title desc">
  <title id="title">에폭이 늘수록 감소하는 손실 그래프</title>
  <desc id="desc">에폭 증가에 따라 손실 값이 2.4에서 0.79로 감소하는 선 그래프</desc>
  <rect width="1024" height="640" fill="#ffffff"/>
  <g stroke="#d1d5db" stroke-width="1">
    <line x1="110" y1="520" x2="960" y2="520"/>
    <line x1="110" y1="465" x2="960" y2="465"/>
    <line x1="110" y1="410" x2="960" y2="410"/>
    <line x1="110" y1="355" x2="960" y2="355"/>
    <line x1="110" y1="300" x2="960" y2="300"/>
    <line x1="110" y1="245" x2="960" y2="245"/>
    <line x1="110" y1="190" x2="960" y2="190"/>
    <line x1="110" y1="135" x2="960" y2="135"/>
    <line x1="150" y1="90" x2="150" y2="520"/>
    <line x1="350" y1="90" x2="350" y2="520"/>
    <line x1="550" y1="90" x2="550" y2="520"/>
    <line x1="750" y1="90" x2="750" y2="520"/>
