<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="640" viewBox="0 0 1024 640" role="img" aria-labelledby="title desc">
  <title id="title">공부 시간과 점수 산점도</title>
  <desc id="desc">공부 시간이 늘수록 점수가 함께 높아지는 네 점의 산점도</desc>
  <rect width="1024" height="640" fill="#ffffff"/>
  <g stroke="#d1d5db" stroke-width="1">
    <line x1="100" y1="520" x2="960" y2="520"/>
    <line x1="100" y1="435" x2="960" y2="435"/>
    <line x1="100" y1="350" x2="960" y2="350"/>
    <line x1="100" y1="265" x2="960" y2="265"/>
    <line x1="100" y1="180" x2="960" y2="180"/>
    <line x1="100" y1="95" x2="960" y2="95"/>
    <line x1="140" y1="90" x2="140" y2="520"/>
    <line x1="412" y1="90" x2="412" y2="520"/>
    <line x1="686" y1="90" x2="686" y2="520"/>
    <line x1="960" y1="90" x2="960" y2="520"/>
  </g>
  <g stroke="#111827" stroke-width="2">
    <line x1="100" y1="520" x2="960" y2="520"/>
    <line x1="100" y1="90" x2="100" y2="520"/>
  </g>
  <g fill="#0f766e">
    <circle cx="140" cy="498" r="12"/>
    <circle cx="412" cy="345" r="12"/>
    <circle cx="686" cy="193" r="12"/>
    <circle cx="960" cy="92" r="12"/>
  </g>
  <g fill="#111827" font-family="Pretendard, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
    <text x="512" y="48" font-size="28" text-anchor="middle">공부 시간과 점수의 관계</text>
    <text x="512" y="598" font-size="20" text-anchor="middle">공부 시간</text>
    <text x="42" y="310" font-size="20" text-anchor="middle" transform="rotate(-90 42 310)">점수</text>
    <text x="140" y="548" font-size="16" text-anchor="middle">2</text>
    <text x="412" y="548" font-size="16" text-anchor="middle">4</text>
    <text x="686" y="548" font-size="16" text-anchor="middle">6</text>
    <text x="960" y="548" font-size="16" text-anchor="middle">8</text>
    <text x="88" y="523" font-size="16" text-anchor="end">60</text>
    <text x="88" y="438" font-size="16" text-anchor="end">65</text>
    <text x="88" y="353" font-size="16" text-anchor="end">70</text>
    <text x="88" y="268" font-size="16" text-anchor="end">75</text>
    <text x="88" y="183" font-size="16" text-anchor="end">80</text>
    <text x="88" y="98" font-size="16" text-anchor="end">85</text>
  </g>
</svg>
